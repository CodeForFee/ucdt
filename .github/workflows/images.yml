# images — build (and, off pull_request, push) the three GHCR images this stack runs from.
# Image names and tag scheme are a contract: T-013 (deploy) pulls exactly these.
name: images

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  climate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeforfee/ucdt-climate
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - uses: docker/build-push-action@v6
        with:
          context: services/climate
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=climate
          cache-to: type=gha,mode=max,scope=climate

  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeforfee/ucdt-gateway
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check VITE_MAPBOX_TOKEN secret
        id: token_check
        run: |
          if [ -z "${{ secrets.VITE_MAPBOX_TOKEN }}" ]; then
            echo "::warning::VITE_MAPBOX_TOKEN secret is empty; skipping the ucdt-web image build (never built with a placeholder token)."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token_check.outputs.has_token == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.token_check.outputs.has_token == 'true'
      - uses: docker/login-action@v3
        if: steps.token_check.outputs.has_token == 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.token_check.outputs.has_token == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeforfee/ucdt-web
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - uses: docker/build-push-action@v6
        if: steps.token_check.outputs.has_token == 'true'
        with:
          context: .
          file: infra/web.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
