# web — Vite + React SPA. Owned by T-005 (build/lint/test), extended by T-012.
name: web

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F web lint
      - run: pnpm -F web test
      - run: pnpm -F web build
        env:
          VITE_MAPBOX_TOKEN: pk.ci-placeholder
