# climate — Python data + processing layer. Owned by T-002 (tests), extended by T-012.
# No path filter: this job is a required check, and a required check that is
# skipped by a filter blocks every PR that does not touch it.
name: climate

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  climate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/climate
    # PostGIS for the DB tests (T-003); the PDIM tests are pure and ignore it.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: ucdt
          POSTGRES_USER: ucdt
          POSTGRES_PASSWORD: ucdt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucdt -d ucdt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ucdt:ucdt@localhost:5432/ucdt
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
