# climate — Python data + processing layer. Owned by T-002 (tests), extended by T-012.
# No path filter: this job is a required check, and a required check that is
# skipped by a filter blocks every PR that does not touch it.
name: climate

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: climate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/climate
    # PostGIS for the DB tests (T-003); the PDIM tests are pure and ignore it.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: ucdt
          POSTGRES_USER: ucdt
          POSTGRES_PASSWORD: ucdt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucdt -d ucdt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ucdt:ucdt@localhost:5432/ucdt
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/climate/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Contracts drift check (T-007): packages/contracts must be exactly what the
      # climate app's OpenAPI schema generates. Needs both uv (dump_openapi) and
      # pnpm (openapi-typescript), hence it lives in this job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: uv run python -m climate.api.dump_openapi
      - run: pnpm -F @ucdt/contracts gen
        working-directory: ${{ github.workspace }}
      - run: git diff --exit-code -- packages/contracts
        working-directory: ${{ github.workspace }}
