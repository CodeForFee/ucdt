# deploy — runs infra/deploy.sh on the VPS after `images` finishes publishing to GHCR on main.
# The SSH key (VPS_SSH_KEY secret) is scoped to the `deploy` user and forced, in
# ~/.ssh/authorized_keys on the VPS, to run exactly `/opt/ucdt/infra/deploy.sh` (deploy.sh cds
# to the repo root itself) — even a leaked key can't do anything else. See docs/DEPLOY.md.
# (An earlier version of this forced command used `cd /opt/ucdt && infra/deploy.sh`; a shell
# quoting bug turned `&&` into `\&\&` when it was written, so `cd` saw four arguments and every
# deploy failed — the absolute-path form here has no `&&` to mangle.)
name: deploy

on:
  workflow_run:
    workflows: [images]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and run infra/deploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The authorized_keys forced command ignores this and always runs deploy.sh —
          # spelled out here only for readability.
          script: /opt/ucdt/infra/deploy.sh
