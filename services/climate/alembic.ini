# Alembic for the climate DB. Run from services/climate: `uv run alembic upgrade head`.
# The URL is NOT set here: env.py takes config.attributes["url"] (tests) or
# climate.config.get_settings().database_url (DATABASE_URL / .env).
[alembic]
script_location = %(here)s/climate/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
