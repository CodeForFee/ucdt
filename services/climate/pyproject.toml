[project]
name = "climate"
version = "0.1.0"
description = "UCDT data + processing layer: ingestion, PDIM models, snapshots, rules, simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "httpx>=0.28",
    "arq>=0.26",
]

[dependency-groups]
derive = [
    "rasterio>=1.4.3",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
